spring:
  datasource:
    primary:
      driver-class-name: oracle.jdbc.OracleDriver
      url: jdbc:oracle:thin:@//127.0.0.1:1521/orclpdb1
      username: ${VALSET_DATASOURCE_USERNAME:valset}
      password: ${VALSET_DATASOURCE_PASSWORD:valset}
      hikari:
        maximum-pool-size: 20
        minimum-idle: 5
        connection-timeout: 30000
        max-lifetime: 1800000
        idle-timeout: 600000
        pool-name: valset-oracle-datasource
