spring:
  datasource:
    primary:
      url: jdbc:postgresql://127.0.0.1:5432/t_datamiddle_subject?currentSchema=public
      username: ${VALSET_DATASOURCE_USERNAME:root}
      password: ${VALSET_DATASOURCE_PASSWORD:root}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 20
        minimum-idle: 5
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
